<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>너의 이름은.</title>
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/text-style.css" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="poster">
      <!-- 흑백세상 -->
      <div class="world">
        <img class="bg-img" src="./asset/bg.png" />

        <!-- 별이 호수에 반짝반짝 -->
        <div class="lake-stars">
          <img class="star lake-star-1" src="./asset/star.png" />
          <img class="star lake-star-2" src="./asset/star.png" />
          <img class="star lake-star-3" src="./asset/star.png" />
          <img class="star lake-star-4" src="./asset/star.png" />
        </div>

        <!-- 구름 -->
        <img class="cloud cd2" src="./asset/cd2.png" />
        <img class="cloud cd1" src="./asset/cd1.png" />

        <!-- 타키 -->
        <img class="mitsuha" src="./asset/mitsuha.png" />
        <img class="taki" src="./asset/taki.png" />

        <img class="rope-on" src="./asset/rofe.png" />

        <img class="cloud cd3" src="./asset/cd3.png" />

        <img class="filter-img" src="./asset/bg2.png" />
      </div>

      <!-- 끈 -->
      <img class="rope-off" src="./asset/rofe2.png" />

      <!-- 별 -->
      <div class="sky-area">
        <img class="star star-1" src="./asset/star.png" />
        <img class="star star-2" src="./asset/star.png" />
        <img class="star star-3" src="./asset/star.png" />
        <img class="star star-4" src="./asset/star.png" />
      </div>

      <!-- 검정 띠 -->
      <div class="bar bar-top"></div>
      <div class="bar bar-bottom"></div>

      <!-- 자막 -->
      <p class="sub sub-1">
        <span class="sub-jp" style="animation-delay: 5.0s">[瀧] お前が世界のどこにいても、俺が必ずもう一度会いに行く。</span><br />
        <span style="animation-delay: 5.0s">[타키]</span>
        <span style="animation-delay: 5.0s">네</span><span style="animation-delay: 5.1s">가</span>
        <span style="animation-delay: 5.3s">세</span><span style="animation-delay: 5.4s">상</span>
        <span style="animation-delay: 5.6s">어</span><span style="animation-delay: 5.7s">디</span><span style="animation-delay: 5.8s">에</span>
        <span style="animation-delay: 6.0s">있</span><span style="animation-delay: 6.1s">든</span><span style="animation-delay: 6.2s">,</span>
        <span style="animation-delay: 6.4s">반</span><span style="animation-delay: 6.5s">드</span><span style="animation-delay: 6.6s">시</span>
        <span style="animation-delay: 6.8s">다</span><span style="animation-delay: 6.9s">시</span>
        <span style="animation-delay: 7.1s">만</span><span style="animation-delay: 7.2s">나</span><span style="animation-delay: 7.3s">러</span>
        <span style="animation-delay: 7.5s">갈</span><span style="animation-delay: 7.6s">게</span><span style="animation-delay: 7.7s">.</span>
      </p>
      <p class="sub sub-2">
        <span class="sub-jp" style="animation-delay: 10.5s">[三葉] うん、私たちは会えば絶対すぐにわかる。</span><br />
        <span style="animation-delay: 10.5s">[미츠하]</span>
        <span style="animation-delay: 10.5s">응</span><span style="animation-delay: 10.6s">,</span>
        <span style="animation-delay: 10.8s">우</span><span style="animation-delay: 10.9s">리</span><span style="animation-delay: 11.0s">는</span>
        <span style="animation-delay: 11.2s">만</span><span style="animation-delay: 11.3s">나</span><span style="animation-delay: 11.4s">면</span>
        <span style="animation-delay: 11.6s">분</span><span style="animation-delay: 11.7s">명</span>
        <span style="animation-delay: 11.9s">바</span><span style="animation-delay: 12.0s">로</span>
        <span style="animation-delay: 12.2s">알</span><span style="animation-delay: 12.3s">아</span><span style="animation-delay: 12.4s">볼</span>
        <span style="animation-delay: 12.6s">거</span><span style="animation-delay: 12.7s">야</span><span style="animation-delay: 12.8s">.</span>
      </p>

      <!-- 포스터 글자 -->
      <div class="poster-text">
        <p class="copy-top">전세계를 사랑에 빠지게 한 기적의 이야기</p>
        <h1 class="title">
          <span style="animation-delay: 18.0s">너</span><span style="animation-delay: 18.3s">의</span><span style="animation-delay: 18.6s">이</span><span style="animation-delay: 18.9s">름</span><span style="animation-delay: 19.2s">은</span><span class="title-dot" style="animation-delay: 20.2s">。</span>
        </h1>
        <p class="title-en">your name.</p>
        <p class="copy-mid">
          <span style="animation-delay: 22.0s">절</span><span style="animation-delay: 22.1s">대</span>
          <span style="animation-delay: 22.3s">잊</span><span style="animation-delay: 22.4s">지</span>
          <span style="animation-delay: 22.6s">않</span><span style="animation-delay: 22.7s">도</span><span style="animation-delay: 22.8s">록</span>
          <br />
          <span style="animation-delay: 23.3s">서</span><span style="animation-delay: 23.4s">로</span><span style="animation-delay: 23.5s">에</span><span style="animation-delay: 23.6s">게</span>
          <span style="animation-delay: 23.8s">이</span><span style="animation-delay: 23.9s">름</span><span style="animation-delay: 24.0s">을</span>
          <span style="animation-delay: 24.2s">써</span><span style="animation-delay: 24.3s">주</span><span style="animation-delay: 24.4s">자</span>
        </p>
        <p class="director">신카이 마코토 감독 작품</p>
        <p class="release">절찬 상영중</p>
      </div>
    </div>
  </body>
</html>
